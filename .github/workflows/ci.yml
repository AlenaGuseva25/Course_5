name: Coursse_5 CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Run flake8
        run: poetry run flake8

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Create environment file
        run: |
          echo "SECRET_KEY=test-key-12345" > .env
          echo "DEBUG=True" >> .env
          echo "POSTGRES_DB=test_db" >> .env
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=postgres" >> .env
          echo "POSTGRES_HOST=localhost" >> .env
          echo "POSTGRES_PORT=5432" >> .env

      - name: Run migrate
        run: poetry run python manage.py migrate

      - name: Run tests
        run: poetry run python manage.py test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in in Docker hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/course_5:${{ github.sha }} .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/course_5:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [test, build]

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: TEST - Create archive
        run: |
          echo "=== Current directory ==="
          pwd
          ls -la
            
          echo "=== Copying files to temp directory ==="
          mkdir -p /tmp/deploy_files
          cp -r . /tmp/deploy_files/
            
          echo "=== Files in temp directory ==="
          ls -la /tmp/deploy_files/
            
          echo "=== Creating archive ==="
          cd /tmp/deploy_files
          tar --exclude='__pycache__' --exclude='.venv' --exclude='.git' -czf /tmp/deploy.tar.gz .
            
          echo "=== Archive info ==="
          ls -lh /tmp/deploy.tar.gz
          echo "Files in archive:"
          tar -tzf /tmp/deploy.tar.gz | wc -l  

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: TEST - Copy archive to server
        run: |
          echo "=== Copying archive ==="
          scp -o StrictHostKeyChecking=no /tmp/deploy.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:/tmp/

          echo "=== Checking archive on server ==="
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
            echo 'Archive on server:'
            ls -lh /tmp/deploy.tar.gz
            echo 'Files in archive on server:'
            tar -tzf /tmp/deploy.tar.gz | wc -l
          "

      - name: Extract archive on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
          echo '=== Extracting archive ==='
          mkdir -p ${{ secrets.DEPLOY_DIR }}
          cd ${{ secrets.DEPLOY_DIR }}
          tar -xzf /tmp/deploy.tar.gz
          echo '=== Files after extraction ==='
          ls -la
          "

      - name: Create environment file on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
          cd ${{ secrets.DEPLOY_DIR }}
          echo '=== Creating .env file ==='
          echo 'SECRET_KEY=test-secret-key-1234567890' > .env
          echo 'DEBUG=True' >> .env
          cat .env
          "

      - name: Install dependencies on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
            cd ${{ secrets.DEPLOY_DIR }}
            echo '=== Installing dependencies ==='
            python3 -m venv /tmp/poetry_venv
            /tmp/poetry_venv/bin/pip install --upgrade pip
            /tmp/poetry_venv/bin/pip install poetry
            /tmp/poetry_venv/bin/poetry config virtualenvs.in-project true
            /tmp/poetry_venv/bin/poetry install --no-root
            echo 'Dependencies installed!'
          "

      - name: Start application
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
            cd ${{ secrets.DEPLOY_DIR }}
            echo '=== Starting application ==='
            source .venv/bin/activate
            nohup python manage.py runserver 0.0.0.0:8001 > django.log 2>&1 &
            sleep 10  # Дать больше времени для запуска
            echo 'App started!'
          "

      - name: Check application logs
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
          cd ${{ secrets.DEPLOY_DIR }}
          echo '=== Application logs ==='
          tail -30 django.log
          echo '=== Running processes ==='
          ps aux | grep python
          echo '=== Port 8001 status ==='
          ss -tlnp | grep 8001
          "

      - name: Final check
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
            echo '=== FINAL STATE ==='
            ls -la ${{ secrets.DEPLOY_DIR }}/
            echo '=== Is app running? ==='
            curl -f http://localhost:8001/ || echo 'App not running'
          "